<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Migration Studio</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5b6270; --line: #dfe3ea;
    --accent: #3b5bdb; --accent-ink: #ffffff; --code-bg: #0f1420; --code-ink: #e6e9f2;
    --info: #1c7ed6; --warn: #b7791f; --err: #c92a2a; --ok: #2b8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1017; --panel: #151a24; --ink: #e8ebf2; --muted: #98a1b3; --line: #262d3b;
      --accent: #7c93ff; --accent-ink: #0d1017; --code-bg: #0a0d14; --code-ink: #e6e9f2;
      --info: #5aa9ff; --warn: #f0b429; --err: #ff6b6b; --ok: #51cf66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1017; --panel: #151a24; --ink: #e8ebf2; --muted: #98a1b3; --line: #262d3b;
    --accent: #7c93ff; --accent-ink: #0d1017; --code-bg: #0a0d14; --code-ink: #e6e9f2;
    --info: #5aa9ff; --warn: #f0b429; --err: #ff6b6b; --ok: #51cf66;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 14px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label.field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  input[type=text], select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px 28px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); align-items: flex-end; }
  .tabs .spacer { flex: 1; }
  .tab { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); border-radius: 0; }
  .tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--line); color: var(--ink); font-size: 12px; text-align: center; }
  .badge.has { background: var(--warn); color: #fff; }
  textarea, pre.code { margin: 0; width: 100%; flex: 1; min-height: 430px; border: 0; padding: 14px; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
  textarea { background: var(--panel); color: var(--ink); }
  pre.code { background: var(--code-bg); color: var(--code-ink); overflow: auto; white-space: pre; border-radius: 0 0 10px 10px; }
  .toolbar { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  ul.items { list-style: none; margin: 0; padding: 12px 14px; min-height: 430px; overflow: auto; }
  ul.items li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .sev { flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; margin-top: 2px; }
  .sev.info { color: var(--info); } .sev.warning { color: var(--warn); } .sev.error { color: var(--err); }
  .ai-tag { font-size: 11px; color: var(--muted); }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--err); }
  .empty { padding: 18px; color: var(--muted); }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header>
  <h1>AI Migration Studio <span>Aurelia 1 → React + TypeScript</span></h1>
  <div class="controls">
    <label class="field">Component <input type="text" id="name" value="todo-item" size="14" aria-label="Component file name"></label>
    <label class="field">Source
      <select id="language" aria-label="View-model language"><option value="js">JavaScript</option><option value="ts">TypeScript</option></select>
    </label>
    <label class="field" id="aiLabel"><input type="checkbox" id="useAi"> Refine with Claude</label>
    <button id="sample" type="button">Load sample</button>
    <button id="run" type="button" class="primary">Migrate</button>
  </div>
</header>

<main>
  <section class="card" aria-label="Aurelia source">
    <div class="tabs" role="tablist" aria-label="Aurelia source files">
      <button class="tab" role="tab" id="tab-view" aria-selected="true" aria-controls="panel-view">View (.html)</button>
      <button class="tab" role="tab" id="tab-vm" aria-selected="false" aria-controls="panel-vm">View-model (.js / .ts)</button>
    </div>
    <textarea id="panel-view" role="tabpanel" aria-labelledby="tab-view" spellcheck="false"></textarea>
    <textarea id="panel-vm" role="tabpanel" aria-labelledby="tab-vm" spellcheck="false" hidden></textarea>
    <div class="toolbar"><span class="status" id="status" role="status" aria-live="polite">Ready.</span></div>
  </section>

  <section class="card" aria-label="React output">
    <div class="tabs" role="tablist" aria-label="Migration output">
      <button class="tab" role="tab" id="tab-out" aria-selected="true" aria-controls="panel-out">React (.tsx)</button>
      <button class="tab" role="tab" id="tab-review" aria-selected="false" aria-controls="panel-review">Review items<span class="badge" id="count">0</span></button>
      <span class="spacer"></span>
      <button type="button" id="copy">Copy</button>
      <button type="button" id="download">Download</button>
    </div>
    <pre class="code" id="panel-out" role="tabpanel" aria-labelledby="tab-out" tabindex="0"></pre>
    <ul class="items" id="panel-review" role="tabpanel" aria-labelledby="tab-review" hidden></ul>
    <div class="toolbar"><span id="meta"></span></div>
  </section>
</main>

<script>
const SAMPLE_VIEW = `<template>
  <li class="todo \${todo.done ? 'done' : ''}">
    <input type="checkbox" checked.bind="todo.done">
    <span if.bind="!editing" dblclick.trigger="toggleEdit()">\${todo.text}</span>
    <input if.bind="editing" type="text" value.bind="todo.text" blur.trigger="toggleEdit()">
    <button type="button" click.delegate="remove()">x</button>
    <small show.bind="todo.done">\${todo.text | upper}</small>
  </li>
</template>`;
const SAMPLE_VM = `import { bindable } from 'aurelia-framework';

export class TodoItem {
  @bindable todo;
  @bindable remove;
  editing = false;

  toggleEdit() {
    this.editing = !this.editing;
  }

  todoChanged(newValue) {
    console.log('todo changed', newValue);
  }

  detached() {
    console.log('bye');
  }
}`;

const $ = (id) => document.getElementById(id);
const state = { fileName: 'Component.tsx', tsx: '', warnings: [], aiConfigured: false };

function select(group, activeId) {
  for (const [tab, panel] of group) {
    const on = tab === activeId;
    $(tab).setAttribute('aria-selected', String(on));
    $(panel).hidden = !on;
  }
}
const left = [['tab-view', 'panel-view'], ['tab-vm', 'panel-vm']];
const right = [['tab-out', 'panel-out'], ['tab-review', 'panel-review']];
for (const g of [left, right]) for (const [tab] of g) $(tab).addEventListener('click', () => select(g, tab));

function render() {
  $('panel-out').textContent = state.tsx;
  const review = state.warnings.filter((w) => w.severity !== 'info').length;
  $('count').textContent = String(review);
  $('count').classList.toggle('has', review > 0);
  const ul = $('panel-review');
  ul.innerHTML = '';
  if (!state.warnings.length) ul.innerHTML = '<li class="empty">No review items.</li>';
  for (const w of state.warnings) {
    const li = document.createElement('li');
    const sev = document.createElement('span'); sev.className = 'sev ' + w.severity; sev.textContent = w.severity;
    const msg = document.createElement('div'); msg.textContent = (w.line ? `Line ${w.line}: ` : '') + w.message;
    if (w.needsAi) { const t = document.createElement('div'); t.className = 'ai-tag'; t.textContent = 'AI can help resolve this'; msg.appendChild(t); }
    li.append(sev, msg); ul.appendChild(li);
  }
  $('meta').textContent = `${state.fileName} · ${state.tsx.split('\n').length} lines`;
}

function setStatus(text, err) { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!err); }

async function migrate() {
  setStatus('Migrating…');
  $('run').disabled = true;
  try {
    const res = await fetch('/api/migrate', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        name: $('name').value.trim() || 'component', html: $('panel-view').value,
        code: $('panel-vm').value || undefined, language: $('language').value, useAi: $('useAi').checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) { setStatus(data.error || 'Migration failed', true); return; }
    Object.assign(state, { fileName: data.fileName, tsx: data.tsx, warnings: data.warnings });
    render();
    setStatus(data.usedAi ? 'Done (AI-refined).' : 'Done (deterministic).');
  } catch (e) { setStatus('Request failed: ' + e.message, true); }
  finally { $('run').disabled = false; }
}

function loadSample() {
  $('panel-view').value = SAMPLE_VIEW; $('panel-vm').value = SAMPLE_VM;
  $('name').value = 'todo-item'; $('language').value = 'js';
}

$('run').addEventListener('click', migrate);
$('sample').addEventListener('click', () => { loadSample(); migrate(); });
let timer; for (const id of ['panel-view', 'panel-vm', 'name', 'language']) $(id).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(migrate, 500); });
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(state.tsx); setStatus('Copied to clipboard.'); } catch { setStatus('Copy failed; select the code manually.', true); }
});
$('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([state.tsx], { type: 'text/plain' })); a.download = state.fileName; a.click(); URL.revokeObjectURL(a.href);
});

(async function init() {
  try {
    const cfg = await (await fetch('/api/config')).json();
    state.aiConfigured = !!cfg.aiConfigured;
  } catch { /* offline */ }
  $('useAi').disabled = !state.aiConfigured;
  $('aiLabel').title = state.aiConfigured ? 'Send flagged items to Claude, then re-validate the result' : 'Set ANTHROPIC_API_KEY on the server to enable AI refinement';
  loadSample(); migrate();
})();
</script>
</body>
</html>
